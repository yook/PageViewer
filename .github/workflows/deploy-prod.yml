name: Deploy Site Prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/pageviewer/site

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pageviewer.ru
    concurrency:
      group: pageviewer-site-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Yandex Metrika
        run: node scripts/check-analytics.mjs

      - name: Archive site
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='site.tgz' \
            -czf site.tgz . || test -f site.tgz

      - name: Upload archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY_DEV }}
          source: site.tgz
          target: /tmp

      - name: Publish production site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY_DEV }}
          script_stop: true
          script: |
            mkdir -p "${{ env.DEPLOY_PATH }}"
            find "${{ env.DEPLOY_PATH }}" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} +
            tar -xzf /tmp/site.tgz -C "${{ env.DEPLOY_PATH }}"
            rm -f /tmp/site.tgz
