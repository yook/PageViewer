name: Deploy Site Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://dev.pageviewer.ru
    concurrency:
      group: pageviewer-site-staging
      cancel-in-progress: true
    env:
      ARCHIVE_NAME: site-dev.tgz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Yandex Metrika
        run: node scripts/check-analytics.mjs

      - name: Archive site
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='site.tgz' \
            --exclude='site-dev.tgz' \
            --exclude='site-prod.tgz' \
            -czf "${{ env.ARCHIVE_NAME }}" . || test -f "${{ env.ARCHIVE_NAME }}"

      - name: Upload archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV || secrets.SSH_PRIVATE_KEY }}
          source: ${{ env.ARCHIVE_NAME }}
          target: /tmp

      - name: Publish staging site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV || secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            mkdir -p "${{ secrets.DEPLOY_PATH_DEV }}"
            find "${{ secrets.DEPLOY_PATH_DEV }}" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} +
            tar -xzf "/tmp/${{ env.ARCHIVE_NAME }}" -C "${{ secrets.DEPLOY_PATH_DEV }}"
            rm -f "/tmp/${{ env.ARCHIVE_NAME }}"
